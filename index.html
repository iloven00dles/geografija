<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geografijos Žaidimai</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Dekoratyviniai burbulai paslepiami, nes jie netinka paprastam stiliui */
        .bubble {
            display: none;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 1000px;
            width: 100%;
            box-sizing: border-box;
        }

        .header h1 {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            color: #ecf0f1;
        }

        .header p {
            font-size: 1.2rem;
            color: #bdc3c7;
            margin-bottom: 50px;
        }

        .cards {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background-color: #ecf0f1;
            border-radius: 8px;
            padding: 40px 30px;
            width: 280px;
            text-decoration: none;
            color: #2c3e50;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 4px solid #bdc3c7;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .icon-wrapper {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            color: #2c3e50;
        }

        .card p {
            font-size: 1rem;
            line-height: 1.5;
            color: #34495e;
            margin: 0 0 25px 0;
            flex-grow: 1;
        }

        .btn {
            background-color: #3498db;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            width: 100%;
            box-sizing: border-box;
        }

        .card:hover .btn {
            background-color: #2980b9;
        }

        .btn-green {
            background-color: #27ae60;
        }

        .card:hover .btn-green {
            background-color: #2ecc71;
        }

        @media (max-width: 800px) {
            .cards {
                flex-direction: column;
                align-items: center;
            }

            .header h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>

    <div class="container">
        <div class="header">
            <h1>🌍Geografijos testukai:D</h1>
        </div>

        <div class="cards">
            <!-- Pasaulio testas -->
            <a href="pasaulis.html" class="card">
                <div class="icon-wrapper">🗺️</div>
                <h2>Pasaulis</h2>
                <p> salos, pusiasaliai, jūros, įlankos, sąsiauriai ir kanalai. senas testas.</p>
                <div class="btn">Žaisti</div>
            </a>

            <!-- Lietuvos testas -->
            <a href="lietuva.html" class="card">
                <div class="icon-wrapper">🇱🇹</div>
                <h2>Lietuva</h2>
                <p> upės, ežerai, marios, aukštumos. naujas testas. </p>
                <div class="btn btn-green">Žaisti</div>
            </a>
        </div>
    </div>
</body>

</html>
