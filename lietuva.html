    <meta charset="UTF-8">

    <title>Lietuvos geografijos testas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #task-box {
            background-color: #ecf0f1;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            border-bottom: 2px solid #bdc3c7;
        }

        #map {
            flex-grow: 1;
            width: 100%;
            cursor: crosshair;
        }

        .target-name {
            font-weight: bold;
            color: #e74c3c;
        }

        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            border-radius: 5px;
            margin: 5px;
        }

        .btn:hover {
            background-color: #2ecc71;
        }

        .btn-secondary {
            background-color: #3498db;
        }

        .btn-secondary:hover {
            background-color: #5dade2;
        }

        .info-panel {
            font-size: 0.9em;
        }

        #feedback {
            margin-top: 10px;
            font-weight: bold;
            min-height: 24px;
        }

        /* Stiliai teisingam/neteisingam atsakymui */
        .correct {
            color: #27ae60;
        }

        .incorrect {
            color: #c0392b;
        }

        .partial {
            color: #f39c12;
        }

        /* Pradinis ekranas */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            overflow-y: auto;
            padding: 20px;
        }

        #start-screen h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        #start-screen h2 {
            font-size: 1.5em;
            margin-bottom: 15px;
            margin-top: 0px;
        }

        #start-screen p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .exam-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }

        .exam-btn {
            background-color: #e74c3c;
            padding: 15px 30px;
            font-size: 1.1em;
        }

        .exam-btn:hover {
            background-color: #c0392b;
        }

        /* Objektų tipų pasirinkimas */
        .type-selection {
            max-width: 700px;
            margin: 20px auto;
        }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 25px;
            margin-bottom: 20px;
        }

        .type-checkbox {
            display: none;
        }

        .type-label {
            padding: 12px;
            background-color: #34495e;
            border: 2px solid #34495e;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .type-label:hover {
            background-color: #4a5f7f;
        }

        .type-checkbox:checked+.type-label {
            background-color: #27ae60;
            border-color: #27ae60;
        }

        .select-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .select-btn {
            background-color: #7f8c8d;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .select-btn:hover {
            background-color: #95a5a6;
        }

        /* Rezultatų lentelė */
        #results-table {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            color: #2c3e50;
            padding: 20px;
            border-radius: 10px;
        }

        #results-table h2 {
            margin: 0 0 15px 0;
            font-size: 2em;
            text-align: center;
        }

        #results-table h3 {
            margin: 0 0 15px 0;
            font-size: 1.2em;
            text-align: center;
        }

        #results-table .table-wrapper {
            max-height: 50vh;
            overflow-y: auto;
            margin: 15px 0;
        }

        #results-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        #results-table th,
        #results-table td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        #results-table th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
        }

        #results-table .gif-container {
            margin: 15px 0;
            text-align: center;
        }

        #results-table .btn-container {
            margin-top: 15px;
            text-align: center;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .grade-excellent {
            color: #27ae60;
            font-weight: bold;
        }

        .grade-good {
            color: #f39c12;
            font-weight: bold;
        }

        .grade-fail {
            color: #c0392b;
            font-weight: bold;
        }

        .nav-back {
            display: inline-block;
            margin-bottom: 20px;
            color: #ecf0f1;
            background: #34495e;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .nav-back:hover {
            background: #4a5f7f;
        }
    </style>
</head>

<body>

    <div id="start-screen">
        <a href="index.html" class="nav-back">&larr; Atgal į meniu</a>
        <h1>🇱🇹 Lietuvos geografijos testas</h1>

        <div class="type-selection">
            <h2>Pasirinkite ką mokytis:</h2>
            <div class="select-buttons">
                <button class="btn select-btn" onclick="selectAllTypes()">✓ Visi</button>
                <button class="btn select-btn" onclick="deselectAllTypes()">✗ Nieko</button>
            </div>
            <div class="type-grid">
                <div>
                    <input type="checkbox" id="type-upe" class="type-checkbox" checked>
                    <label for="type-upe" class="type-label">🌊 Upės</label>
                </div>
                <div>
                    <input type="checkbox" id="type-ezeras" class="type-checkbox" checked>
                    <label for="type-ezeras" class="type-label">💧 Ežerai</label>
                </div>
                <div>
                    <input type="checkbox" id="type-marios" class="type-checkbox" checked>
                    <label for="type-marios" class="type-label">⛵ Marios</label>
                </div>
                <div>
                    <input type="checkbox" id="type-aukstuma" class="type-checkbox" checked>
                    <label for="type-aukstuma" class="type-label">⛰️ Aukštumos</label>
                </div>
            </div>
        </div>

        <h2>Pasirinkite testo ilgį:</h2>
        <div class="exam-options">
            <button class="btn exam-btn" onclick="startExam(10)">10 klausimų</button>
            <button class="btn exam-btn" onclick="startExam(15)">15 klausimų</button>
            <button class="btn exam-btn" onclick="startExam(20)">20 klausimų</button>
            <button class="btn exam-btn" onclick="startExam('all')">Visi klausimai</button>
        </div>
    </div>

    <div id="header">
        <div>Taškai: <span id="score">0</span> / <span id="max-score">0</span></div>
        <div class="info-panel">Klausimas <span id="question-num">1</span> / <span id="total-questions">10</span></div>
        <div>Vidurkis: <span id="avg-score">0</span>%</div>
    </div>

    <div id="task-box">
        <div id="question-text">Kraunama...</div>
        <div id="feedback"></div>
        <button id="next-btn" class="btn" onclick="nextLevel()" style="display: none; margin-top: 10px;">Kitas klausimas
            &rarr;</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Žemėlapio inicijavimas

        // Paveiksliuko žemėlapis (Image Overlay). Jei proporcijos netikslios, pareguliuokite šios koordinates.
        const customMapBounds = [[53.85, 20.90], [56.48, 26.85]];
        const customMapImage = L.imageOverlay('image.png', customMapBounds).addTo(map);

        const locations = [
            // --- UPĖS ---
            {
                name: "Nemunas", type: "Upė", points: [
                    [53.94, 23.97], [54.01, 23.97], [54.12, 24.03], [54.16, 24.16], [54.21, 24.14],
                    [54.26, 24.09], [54.31, 24.06], [54.39, 24.05], [54.55, 24.04], [54.60, 24.02],
                    [54.65, 23.94], [54.72, 24.10], [54.80, 24.15], [54.85, 24.05], [54.91, 23.93],

                    [55.07, 22.75], [55.08, 22.58], [55.07, 22.25], [55.06, 21.99], [55.10, 21.88],

                ]
            },

            },
            {

                    [55.41, 24.06], [55.29, 23.98], [55.16, 23.83], [55.05, 23.84], [54.93, 23.77]
                ]
            },
            {
                name: "Mūša", type: "Upė", points: [
                    [56.12, 23.32], [56.16, 23.63], [56.09, 24.10], [56.06, 24.40],
                    [56.18, 24.32], [56.32, 24.38]
                ]
            },
            {
                name: "Dubysa", type: "Upė", points: [
                    [55.87, 23.10], [55.75, 23.01], [55.63, 22.93], [55.51, 23.17],
                    [55.42, 23.31], [55.25, 23.47], [55.07, 23.44]
                ]
            },
            {
                name: "Venta", type: "Upė", points: [
                    [55.77, 22.46], [55.85, 22.55], [55.95, 22.80], [56.00, 22.93],
                    [56.10, 22.75], [56.19, 22.68], [56.27, 22.45], [56.33, 22.33], [56.40, 22.18]
                ]
            },
            {
                name: "Jūra", type: "Upė", points: [
                    [55.69, 22.02], [55.55, 21.99], [55.45, 22.13], [55.29, 22.15],
                    [55.25, 22.28], [55.15, 22.06], [55.05, 22.13]
                ]
            },
            {
                name: "Minija", type: "Upė", points: [
                    [55.87, 21.82], [55.92, 21.47], [55.71, 21.40], [55.55, 21.32],
                    [55.44, 21.43], [55.35, 21.28]
                ]
            },

            // --- EŽERAI ---
            { name: "Drūkšiai", type: "Ežeras", points: [[55.62, 26.61]] },
            { name: "Tauragnas", type: "Ežeras", points: [[55.44, 25.90]] },
            { name: "Lakajai", type: "Ežeras", points: [[55.22, 25.74]] },
            { name: "Dusia", type: "Ežeras", points: [[54.29, 23.68]] },
            { name: "Žuvintas", type: "Ežeras", points: [[54.46, 23.58]] },
            { name: "Vištytis", type: "Ežeras", points: [[54.43, 22.73]] },
            { name: "Lūkstas", type: "Ežeras", points: [[55.71, 22.32]] },
            { name: "Asveja", type: "Ežeras", points: [[55.03, 25.50]] },

            // --- MARIOS ---
            { name: "Kuršių marios", type: "Marios", points: [[55.44, 21.10], [55.30, 21.05], [55.15, 20.95], [54.95, 20.65], [55.55, 21.14]] },
            { name: "Kauno marios", type: "Marios", points: [[54.88, 24.02], [54.85, 24.12], [54.82, 24.23], [54.78, 24.26]] },

            // --- AUKŠTUMOS ---
            { name: "Žemaičių aukštuma", type: "Aukštuma", polygon: [[56.1, 21.6], [56.2, 22.6], [55.7, 23.0], [55.4, 22.7], [55.5, 21.8], [55.8, 21.5]] },
            { name: "Sūduvos aukštuma", type: "Aukštuma", polygon: [[54.8, 22.8], [54.7, 23.7], [54.3, 23.5], [54.3, 22.7]] },
            { name: "Dzūkų aukštuma", type: "Aukštuma", polygon: [[54.5, 23.8], [54.5, 24.5], [53.9, 24.8], [53.9, 23.7]] },
            { name: "Medininkų aukštuma", type: "Aukštuma", polygon: [[54.7, 25.3], [54.7, 25.8], [54.4, 25.8], [54.4, 25.4]] },
            { name: "Aukštaičių aukštuma", type: "Aukštuma", polygon: [[55.9, 24.8], [56.0, 26.2], [55.2, 26.5], [54.9, 25.7], [55.0, 24.9]] }
        ];

        let currentIdx = 0;
        let score = 0;
        let maxScore = 0;
        let isAnswered = false;
        let activeMarkers = [];
        let examQuestions = [];
        let totalQuestions = 10;
        let results = []; // Saugome kiekvieno klausimo rezultatus
        let startTime = null; // Testo pradžios laikas

        const questionText = document.getElementById("question-text");
        const feedbackText = document.getElementById("feedback");
        const nextBtn = document.getElementById("next-btn");
        const scoreEl = document.getElementById("score");
        const maxScoreEl = document.getElementById("max-score");
        const questionNumEl = document.getElementById("question-num");
        const totalQuestionsEl = document.getElementById("total-questions");
        const avgScoreEl = document.getElementById("avg-score");

        // Funkcijos tipų pasirinkimui
        function selectAllTypes() {
            document.querySelectorAll('.type-checkbox').forEach(cb => cb.checked = true);
        }

        function deselectAllTypes() {
            document.querySelectorAll('.type-checkbox').forEach(cb => cb.checked = false);
        }

        // Funkcija gauti pasirinktus tipus
        function getSelectedTypes() {
            const typeMap = {
                'type-upe': 'Upė',
                'type-ezeras': 'Ežeras',
                'type-marios': 'Marios',
                'type-aukstuma': 'Aukštuma'
            };

            const selected = [];
            for (const [id, type] of Object.entries(typeMap)) {
                if (document.getElementById(id).checked) {
                    selected.push(type);
                }
            }
            return selected;
        }

        // Funkcija pradėti egzaminą
        function startExam(numQuestions) {
            // Gauti pasirinktus tipus
            const selectedTypes = getSelectedTypes();

            if (selectedTypes.length === 0) {
                alert('Pasirinkite bent vieną objekto tipą!');
                return;
            }

            // Filtruoti vietoves pagal pasirinktus tipus
            const filteredLocations = locations.filter(loc => selectedTypes.includes(loc.type));

            if (filteredLocations.length === 0) {
                alert('Nėra vietovių su pasirinktais tipais!');
                return;
            }

            // Nustatyti klausimų skaičių
            if (numQuestions === 'all') {
                totalQuestions = filteredLocations.length;
            } else {
                totalQuestions = Math.min(numQuestions, filteredLocations.length);
            }

            // Išmaišome ir paimame reikiamą kiekį klausimų
            const shuffled = [...filteredLocations].sort(() => Math.random() - 0.5);
            examQuestions = shuffled.slice(0, totalQuestions);

            // Paslėpti pradžios ekraną
            document.getElementById("start-screen").style.display = "none";

            // Atnaujinti UI
            totalQuestionsEl.innerText = totalQuestions;
            maxScoreEl.innerText = totalQuestions * 100;

            // Pradėti laikmatį
            startTime = new Date();

            // Pradėti pirmą klausimą
            showQuestion();
        }

        function showQuestion() {
            if (currentIdx >= examQuestions.length) {
                endGame();
                return;
            }

            const loc = examQuestions[currentIdx];
            questionText.innerHTML = `Rask šią vietą: <span class="target-name">${loc.name}</span> (${loc.type})`;
            feedbackText.innerHTML = "Spustelėk žemėlapyje";
            feedbackText.className = "";
            nextBtn.style.display = "none";
            isAnswered = false;

            // Atnaujinti klausimo numerį
            questionNumEl.innerText = currentIdx + 1;

            // Išvalome senus markerius
            activeMarkers.forEach(layer => map.removeLayer(layer));
            activeMarkers = [];
        }

        function calculatePoints(distance, type) {
            const km = distance / 1000;
            let multiplier = 1;

            if (type === 'Marios') multiplier = 1.5;
            if (type === 'Upė') multiplier = 1.2;
            if (type === 'Aukštuma') multiplier = 4.0; // Aukštumos labai didelės teritorijos

            if (km <= 8 * multiplier) return 100;
            if (km <= 15 * multiplier) return 90;
            if (km <= 25 * multiplier) return 80;
            if (km <= 40 * multiplier) return 60;
            if (km <= 60 * multiplier) return 40;
            if (km <= 80 * multiplier) return 20;
            if (km <= 100 * multiplier) return 5;
            return 0;
        }

        function isPointInPolygon(point, polygon) {
            let x = point.lat, y = point.lng;
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                let xi = polygon[i][0], yi = polygon[i][1];
                let xj = polygon[j][0], yj = polygon[j][1];
                let intersect = ((yi > y) !== (yj > y))
                    && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        // Paspaudimo logika
        map.on('click', function (e) {
            if (isAnswered) return;

            isAnswered = true;
            const target = examQuestions[currentIdx];
            const clickLatLng = e.latlng;

            // Pavaizduojame kur paspaudė vartotojas
            const userMarker = L.marker(clickLatLng).addTo(map).bindPopup("Tavo spėjimas").openPopup();
            activeMarkers.push(userMarker);

            let earnedPoints = 0;
            let distance = Infinity;
            let closestPoint = null;
            let isInside = false;

            // Ar tai buvo poligonas (aukštuma, žemuma)
            if (target.polygon) {
                isInside = isPointInPolygon(clickLatLng, target.polygon);

                if (!isInside) {
                    target.polygon.forEach(point => {
                        const polyPoint = L.latLng(point[0], point[1]);
                        const dist = clickLatLng.distanceTo(polyPoint);
                        if (dist < distance) {
                            distance = dist;
                            closestPoint = polyPoint;
                        }
                    });
                } else {
                    distance = 0;
                }

                // Vizualizuojame plotą
                const polygonLayer = L.polygon(target.polygon, {
                    color: isInside ? '#27ae60' : (distance < 25000 ? '#f39c12' : '#c0392b'),
                    fillColor: isInside ? '#27ae60' : (distance < 25000 ? '#f39c12' : '#c0392b'),
                    fillOpacity: 0.4
                }).addTo(map).bindPopup(target.name);
                activeMarkers.push(polygonLayer);

                // Jeigu neviduje, žymime rodykle
                if (!isInside && closestPoint) {
                    const line = L.polyline([clickLatLng, closestPoint], { color: '#3498db', dashArray: '5, 10' }).addTo(map);
                    activeMarkers.push(line);
                }

                if (isInside) {
                    earnedPoints = 100;
                } else {
                    earnedPoints = calculatePoints(distance, target.type);
                }

                const km = (distance / 1000).toFixed(0);

                if (isInside || earnedPoints === 100) {
                    feedbackText.innerHTML = `🎯 Puiku! Pataikei į ${target.name}! (+${earnedPoints} tšk.)`;
                    feedbackText.className = "correct";
                } else if (earnedPoints >= 40) {
                    feedbackText.innerHTML = `📍 Visai neblogai! Nutolęs ${km} km nuo ${target.name}. (+${earnedPoints} tšk.)`;
                    feedbackText.className = "partial";
                } else {
                    feedbackText.innerHTML = `❌ Per toli - ${km} km nuo ${target.name}. (+${earnedPoints} tšk.)`;
                    feedbackText.className = "incorrect";
                }

            }
            // Visi kiti (Upės, ežerai, marios) kuriems reikia surasti atstumą iki linijos/taškų
            else if (target.points) {
                target.points.forEach(point => {
                    const polyPoint = L.latLng(point[0], point[1]);
                    const dist = clickLatLng.distanceTo(polyPoint);
                    if (dist < distance) {
                        distance = dist;
                        closestPoint = polyPoint;
                    }
                });

                // Vizualizacija nupiešiama pagal tipą
                if (target.type === 'Upė' || target.type === 'Marios') {
                    const polyline = L.polyline(target.points, { color: '#27ae60', weight: 5, opacity: 0.8 }).addTo(map).bindPopup(target.name);
                    activeMarkers.push(polyline);
                }

                // Pažymim artimiausią rastą tašką
                const correctMarker = L.circleMarker(closestPoint, {
                    color: '#27ae60',
                    radius: 8,
                    fillOpacity: 1
                }).addTo(map).bindPopup(target.name);
                activeMarkers.push(correctMarker);

                // Nupiešiam linija nuo paspaudimo ik artimiausio taško
                const line = L.polyline([clickLatLng, closestPoint], { color: '#3498db', dashArray: '5, 10' }).addTo(map);
                activeMarkers.push(line);

                // Taškų skaičiavimas 
                earnedPoints = calculatePoints(distance, target.type);
                const km = (distance / 1000).toFixed(0);

                if (earnedPoints === 100) {
                    feedbackText.innerHTML = `🎯 Puikiai! Atstumas ${km} km. (+${earnedPoints} tšk.)`;
                    feedbackText.className = "correct";
                } else if (earnedPoints >= 40) {
                    feedbackText.innerHTML = `📍 Visai neblogai! Nutolęs ${km} km nuo ${target.name}. (+${earnedPoints} tšk.)`;
                    feedbackText.className = "partial";
                } else {
                    feedbackText.innerHTML = `❌ Per toli - ${km} km nuo ${target.name}. (+${earnedPoints} tšk.)`;
                    feedbackText.className = "incorrect";
                }
            }

            // Saugome rezultatą
            results.push({
                location: target.name,
                type: target.type,
                points: earnedPoints,
                distance: distance ? (distance / 1000).toFixed(0) : 0,
                isInside: isInside || earnedPoints === 100
            });

            // Atnaujinti taškus
            score += earnedPoints;
            maxScore += 100;
            scoreEl.innerText = Math.round(score);
            maxScoreEl.innerText = maxScore;

            // Skaičiuoti vidurkį
            const avg = (score / maxScore * 100).toFixed(1);
            avgScoreEl.innerText = avg;

            nextBtn.style.display = "inline-block";
        });

        function nextLevel() {
            currentIdx++;
            showQuestion();
        }

        function endGame() {
            // Apskaičiuoti praleistą laiką
            const elapsedTime = new Date() - startTime;
            const totalSeconds = Math.floor(elapsedTime / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const timeString = `${minutes}min ${seconds}s`;

            const percentage = (score / maxScore * 100).toFixed(1);
            let grade = "";
            let gradeClass = "";

            if (percentage >= 90) {
                grade = "PUIKIAI! 🌟";
                gradeClass = "grade-excellent";
            } else if (percentage >= 75) {
                grade = "GERAI! ✓";
                gradeClass = "grade-good";
            } else if (percentage >= 50) {
                grade = "PATENKINAMAI";
                gradeClass = "grade-good";
            } else {
                grade = "NEPAKANKA";
                gradeClass = "grade-fail";
            }

            // GIF'ai pagal rezultatą (Paprastesnis variantas be papildomų if/else, kad taupytų vietą kode)
            let celebrationGif = "";
            if (percentage > 94) {
                celebrationGif = `<div class="tenor-gif-embed" data-postid="14121539344197617839" data-share-method="host" data-aspect-ratio="1" data-width="40%"><a href="https://tenor.com/view/good-job-gif-14121539344197617839">Good Job</a></div>`;
            } else if (percentage < 30) {
                celebrationGif = `<div class="tenor-gif-embed" data-postid="1975526499861417359" data-share-method="host" data-aspect-ratio="1" data-width="40%"><a href="https://tenor.com/view/sad-gif-1975526499861417359">Sad</a></div>`;
            }

            if (celebrationGif !== "" && !document.getElementById('tenor-embed-script')) {
                const script = document.createElement('script');
                script.id = 'tenor-embed-script';
                script.type = 'text/javascript';
                script.async = true;
                script.src = 'https://tenor.com/embed.js';
                document.body.appendChild(script);
            }

            // Sukurti rezultatų lentelę
            let tableHTML = `
            <h2 class="${gradeClass}">${grade}</h2>
            <h3>Galutinis rezultatas: ${Math.round(score)} / ${maxScore} (${percentage}%)</h3>
            <h3>Laikas: ${timeString}</h3>
            <div class="btn-container">
                <button class="btn btn-secondary" onclick="location.reload()">🔄 Naujas testas</button>
                <a href="index.html" class="btn btn-secondary" style="text-decoration:none;">🏠 Į pradinį meniu</a>
            </div>
            <div class="gif-container">${celebrationGif}</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Vietovė</th>
                            <th>Tipas</th>
                            <th>Taškai</th>
                            <th>Nutolimas</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

            results.forEach((result, idx) => {
                const pointClass = result.points >= 90 ? 'correct' : (result.points > 0 ? 'partial' : 'incorrect');
                tableHTML += `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${result.location}</td>
                    <td>${result.type}</td>
                    <td class="${pointClass}">${result.points}/100</td>
                    <td>${result.isInside ? '✓ Nežymus (' + result.distance + ' km)' : result.distance + ' km'}</td>
                </tr>
            `;
            });

            tableHTML += `
                    </tbody>
                </table>
            </div>
        `;

            // Paslėpti žemėlapį ir task-box, rodyti rezultatus full screen
            document.getElementById('map').style.display = 'none';
            document.getElementById('task-box').style.display = 'none';
            document.getElementById('header').style.display = 'none';

            // Sukurti full screen rezultatų langą
            const resultsContainer = document.createElement('div');
            resultsContainer.id = 'results-container';
            resultsContainer.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(44, 62, 80, 0.95); z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box;';
            resultsContainer.innerHTML = `<div id="results-table">${tableHTML}</div>`;
            document.body.appendChild(resultsContainer);
        }

    </script>
